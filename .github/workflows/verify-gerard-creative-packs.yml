name: Verify Gerard creative packs in Publisher
on:
  pull_request:
    paths:
      - "scripts/verify-gerard-creative-packs.mjs"
      - ".github/workflows/verify-gerard-creative-packs.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/verify-gerard-creative-packs.mjs
