name: Gemini text diagnostic
on:
  push:
    branches: [fix/gemini-free-text-provider]
    paths: [.github/workflows/gemini-text-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify secret and make one bounded text request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const key = process.env.GEMINI_API_KEY?.trim();
          if (!key) { console.log(JSON.stringify({secretPresent:false})); process.exit(1); }
          const headers = {'x-goog-api-key':key,'Content-Type':'application/json'};
          const model = 'gemini-3.1-flash-lite';
          const list = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {headers,signal:AbortSignal.timeout(20000)});
          const catalog = await list.json();
          const available = list.ok && catalog.models?.some(m=>m.name==='models/'+model && m.supportedGenerationMethods?.includes('generateContent'));
          console.log(JSON.stringify({secretPresent:true,catalogStatus:list.status,model,available,textModels:catalog.models?.filter(m=>/gemini.*flash.*lite/.test(m.name)).map(m=>m.name)}));
          if (!available) process.exit(1);
          const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent', {
            method:'POST',headers,signal:AbortSignal.timeout(45000),
            body:JSON.stringify({contents:[{role:'user',parts:[{text:'Réponds uniquement : Bonjour Benoît.'}]}],generationConfig:{maxOutputTokens:512,temperature:0}})
          });
          const payload = await response.json();
          const text = payload.candidates?.[0]?.content?.parts?.filter(p=>!p.thought&&typeof p.text==='string').map(p=>p.text).join('').trim() || '';
          console.log(JSON.stringify({status:response.status,errorStatus:payload.error?.status,errorMessage:String(payload.error?.message||'').replaceAll(key,'[redacted]').replace(/\b\d{10,16}\b/g,'[project]').slice(0,500),model,hasText:Boolean(text),text:response.ok?text:undefined,usage:payload.usageMetadata,published:false}));
          if (!response.ok || !text) process.exit(1);
          JS
