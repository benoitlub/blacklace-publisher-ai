name: Deploy Publisher to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Commits made by the Autonomous Knowledge Observatory use the default
  # GITHUB_TOKEN, which never cascade-triggers other workflows via `push`
  # (GitHub's loop-prevention). Without this, a refreshed Knowledge Pack
  # sits committed on main but is never actually republished to Pages
  # until someone happens to push something else or runs this manually.
  workflow_run:
    workflows: ["Autonomous Knowledge Observatory"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Gate: never publish from a tree that does not typecheck. This workflow
      # used to build and deploy on every push to main regardless of CI, so a
      # red Validate never stopped a release.
      #
      # Deliberately narrower than the CI workflow: `typecheck` only, not the
      # test suite, which currently has pre-existing failures unrelated to
      # publication. Tighten this once those tests are green.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build Publisher
        env:
          PORT: 5173
          BASE_PATH: /blacklace-publisher-ai/
          # The page's own hardcoded default (blacklace-publisher-api.onrender.com)
          # is dead. dry-dew-8fb3blacklace-publisher-relay was tried and
          # verified live to be write-only (POST-only mission intake,
          # rejects GET on every path) — it can't serve this page's
          # read-only status/catalog questions. blacklace-publisher-worker
          # is the one that actually implements those as GET endpoints.
          # Not everything this dashboard expects exists there yet: the
          # OAuth connector flow (/connectors/composio/*) has no
          # equivalent, so "Connexions autorisables" still won't work —
          # only the diagnostics cards and the Octopus radar do.
          VITE_API_BASE_URL: https://blacklace-publisher-worker.benoitlubert.workers.dev
        run: pnpm --filter @workspace/blacklace-publisher build

      - name: Prepare Pages artifact
        run: |
          touch artifacts/blacklace-publisher/dist/public/.nojekyll
          cp artifacts/blacklace-publisher/dist/public/index.html artifacts/blacklace-publisher/dist/public/404.html
          # Publish the autonomous Knowledge Packs (refreshed daily by the
          # Autonomous Knowledge Observatory workflow) so consuming apps like
          # Poulpe Fiction can actually fetch them over HTTP. Without this
          # copy, public/knowledge-packs/*.json is only ever committed to
          # the repo and never served anywhere.
          mkdir -p artifacts/blacklace-publisher/dist/public/knowledge-packs
          cp public/knowledge-packs/*.json artifacts/blacklace-publisher/dist/public/knowledge-packs/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/blacklace-publisher/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
