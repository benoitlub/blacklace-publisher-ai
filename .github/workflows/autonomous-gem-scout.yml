name: Publisher Gem Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'

permissions:
  contents: write

concurrency:
  group: publisher-gem-scout
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify scouting policy
        run: node --test scripts/autonomous-gem-scout.test.mjs
      - name: Find and evaluate public gems
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/autonomous-gem-scout.mjs
      - name: Keep the autonomous catalog up to date
        run: |
          git config user.name 'Blacklace Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add public/knowledge-packs/autonomous-github-gems.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'knowledge(publisher): refresh autonomous GitHub gems'
          git push
