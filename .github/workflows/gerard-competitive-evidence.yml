name: Gérard competitive evidence
on:
  pull_request:
    branches: [main]
    paths: ['scripts/gerard-competitive-evidence.mjs', '.github/workflows/gerard-competitive-evidence.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/gerard-competitive-evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and persist public evidence
        run: node scripts/gerard-competitive-evidence.mjs
