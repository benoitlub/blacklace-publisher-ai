name: Inspect Gerard Canva Schema

on:
  push:
    paths:
      - ".github/workflows/test-gerard-social-image.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact Canva tool schema
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://blacklace-publisher-worker.benoitlubert.workers.dev/api/production/canva-tool-schema" \
            | tee canva-schema.json
          echo
          cat canva-schema.json
