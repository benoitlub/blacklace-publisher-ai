name: Agnes secret smoke check (no generation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-agnes-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check secret presence without revealing its value
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        shell: bash
        run: |
          if [ -z "$AGNES_API_KEY" ]; then
            echo "::error::AGNES_API_KEY is missing or empty for this repository/environment"
            exit 1
          fi
          echo "AGNES_API_KEY_PRESENT=true"
          echo "Provider requests: 0; credits spent: 0; no video generated."
