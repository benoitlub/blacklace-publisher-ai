name: Deploy Publisher Worker

on:
  push:
    branches: [main]
    paths:
      - "publisher-worker/**"
      - "scripts/instrument-publisher-worker.mjs"
      - ".github/workflows/deploy-publisher-worker.yml"
  workflow_dispatch: {}

jobs:
  # Gate: never release from a tree that does not typecheck. Until now the
  # deploy workflows were entirely independent from CI, so a red Validate never
  # stopped a release.
  #
  # Deliberately narrower than the CI workflow: it runs `typecheck` only, not
  # the test suite. The suite currently has pre-existing failures unrelated to
  # deployment, and gating on it would freeze every release at once. Tighten
  # this to the full CI pipeline once those tests are green.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Validate Worker text providers
        working-directory: publisher-worker
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund --workspaces=false
          npm run typecheck
          node --import tsx --test src/__tests__/gemini-text.test.mts src/__tests__/octopus-adapter.test.mts src/__tests__/discovery-text-recovery.test.mts

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Gemini secret before deployment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.119.0"
          workingDirectory: publisher-worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
