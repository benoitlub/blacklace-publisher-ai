name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /
      PORT: 5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test API server
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter @workspace/api-server test > /tmp/api-test.log 2>&1; then
            echo "API tests failed. Last 120 lines:"
            tail -n 120 /tmp/api-test.log
            exit 1
          fi
          cat /tmp/api-test.log

      - name: Test Publisher
        run: pnpm --filter @workspace/blacklace-publisher test
