name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /
      PORT: 5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test API server
        id: api_tests
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/api-server test > api-test.log 2>&1
          status=$?
          tail -n 160 api-test.log > api-test-tail.log
          cat api-test-tail.log
          exit $status

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            api-test.log
            api-test-tail.log
          if-no-files-found: error

      - name: Test Publisher
        run: pnpm --filter @workspace/blacklace-publisher test
