name: Resolve Publisher dependency lock
on:
  push:
    branches: [fix/audit-frozen-workspace]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-frozen-workspace
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build: record the Publisher workspace dependency graph"
            git push origin HEAD:fix/audit-frozen-workspace
          fi
