services:
  - type: web
    name: blacklace-publisher-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack pnpm install --no-frozen-lockfile && corepack pnpm --filter @workspace/api-server run build
    startCommand: corepack pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: blacklace-publisher-db
          property: connectionString
      - key: AI_PROVIDER
        value: mistral
      - key: AI_MODEL
        value: mistral-small-latest
      - key: MISTRAL_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_USER_ID
        value: benoit-lubert
      - key: OCTOPUS_ENGINE_URL
        value: https://octopus-engine.onrender.com
      - key: KNOWLEDGE_CONNECTOR
        value: notion
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_API_TOKEN
        sync: false

  - type: web
    name: blacklace-publisher-web
    runtime: static
    rootDir: .
    buildCommand: corepack enable && corepack pnpm install --no-frozen-lockfile && VITE_BUILD_SHA=$(git rev-parse --short HEAD) corepack pnpm --filter @workspace/blacklace-publisher run build
    staticPublishPath: artifacts/blacklace-publisher/dist/public
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3000
      - key: BASE_PATH
        value: /
      - key: VITE_API_BASE_URL
        value: https://blacklace-publisher-api.onrender.com
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html

databases:
  - name: blacklace-publisher-db
    plan: free
