services:
  - type: web
    name: blacklace-publisher-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack pnpm install --no-frozen-lockfile && corepack pnpm --filter @workspace/api-server run build
    startCommand: corepack pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: blacklace-publisher-db
          property: connectionString
      - key: AI_PROVIDER
        value: mistral
      - key: AI_MODEL
        value: mistral-small-latest
      - key: MISTRAL_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_USER_ID
        value: benoit-lubert
      - key: OCTOPUS_ENGINE_URL
        value: https://octopus-engine.onrender.com
      - key: KNOWLEDGE_CONNECTOR
        value: notion
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_API_TOKEN
        sync: false
      - key: PUBLISHER_GITHUB_TOKEN
        sync: false
      - key: PUBLISHER_PAGES_REPOSITORY
        sync: false
      - key: PUBLISHER_PAGES_BRANCH
        value: main
      - key: PUBLISHER_PAGES_ROOT
        value: harvests

databases:
  - name: blacklace-publisher-db
    plan: free
