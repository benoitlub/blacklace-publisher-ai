name = "blacklace-publisher-worker"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Non-secret. Announced to Octopus as this adapter's base URL, so the
# engine can call back into /api/octopus-adapter/execute.
[vars]
PUBLISHER_PUBLIC_URL = "https://blacklace-publisher-worker.benoitlubert.workers.dev"
OCTOPUS_ENGINE_URL = "https://octopus-engine-app.benoitlubert.workers.dev"

# Bound from the account-wide Cloudflare Secrets Store (not the classic
# per-Worker "Variables and Secrets" tab). worker.ts resolves this via
# resolveSecret(), which also supports a plain string in case this ever
# gets configured the classic way instead.
[[secrets_store_secrets]]
binding = "MISTRAL_API_KEY"
store_id = "6cd697779c5d45a0ab6b8833a434adc6"
secret_name = "MISTRAL_API_KEY"

[[secrets_store_secrets]]
binding = "COMPOSIO_API_KEY"
store_id = "6cd697779c5d45a0ab6b8833a434adc6"
secret_name = "COMPOSIO_API_KEY"

# Neon Postgres connection string (postgresql://...). Neon's HTTP driver is
# what makes this reachable at all from a Worker — no raw TCP sockets here.
[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "6cd697779c5d45a0ab6b8833a434adc6"
secret_name = "DATABASE_URL"

# Fine-grained PAT, read-only, "Public Repositories" access is enough —
# only used to read Actions run history on public repos (octopus-engine),
# raising GitHub's rate limit from 60/hour/IP (shared across all of
# Cloudflare's egress pool, confirmed 403 in practice) to 5000/hour/token.
[[secrets_store_secrets]]
binding = "GITHUB_TOKEN"
store_id = "6cd697779c5d45a0ab6b8833a434adc6"
secret_name = "GITHUB_TOKEN"

# Gérard's relentless tentacle loop (runTentacleCycle in worker.ts). Fires
# every 15 minutes; each tentacle's own cooldown (20min-6h, doubling per
# iteration) governs actual pacing, so most ticks find nothing due.
[triggers]
crons = ["*/15 * * * *"]
